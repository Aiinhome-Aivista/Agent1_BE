name: Deploy Python Backend to VPS

on:
  push:
    branches:
      - deploy-1

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aiinhome-aivista/agent_1_be
  CONTAINER_NAME: agent-1-be
  PORT: 3018

jobs:
  # =========================================================
  # 1. BUILD DOCKER IMAGE AND PUSH TO GHCR
  # =========================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=deploy-1
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # 2. DEPLOY TO VPS
  # =========================================================
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment..."
            echo "======================================"

            # Login to GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "Pulling latest Docker image..."

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:deploy-1

            echo "Stopping existing container..."

            docker stop ${{ env.CONTAINER_NAME }} || true

            echo "Removing existing container..."

            docker rm ${{ env.CONTAINER_NAME }} || true

            echo "Starting new container..."

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ env.PORT }}:${{ env.PORT }} \
              --env-file /root/AGENT_1/Agent1_BE/.env \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:deploy-1

            echo "Checking container status..."

            docker ps --filter "name=${{ env.CONTAINER_NAME }}"

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"

            docker image prune -f
