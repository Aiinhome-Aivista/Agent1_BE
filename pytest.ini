[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra -v --tb=short --strict-markers
markers =
    integration: hits real third-party APIs; needs creds in .env.test
    destructive: writes back to the source (e.g. files a GitHub issue); off by default
    slow: takes more than ~5 seconds
